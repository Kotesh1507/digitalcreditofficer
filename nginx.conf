worker_processes 1;
events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  upstream dco_backend {
    server 127.0.0.1:5000;
  }

  upstream insurance_backend {
    server 127.0.0.1:5001;
  }

  server {
    listen 80;

    # ── Insurance WebSocket ──────────────────────────────────────────────────
    location /insurance-socket/ {
      proxy_pass         http://insurance_backend/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
    }

    # ── Insurance REST API ───────────────────────────────────────────────────
    location /insurance-api/ {
      proxy_pass       http://insurance_backend/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ── CDO WebSocket ────────────────────────────────────────────────────────
    location /socket.io/ {
      proxy_pass         http://dco_backend/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
    }

    # ── CDO REST API ─────────────────────────────────────────────────────────
    location /api/ {
      proxy_pass       http://dco_backend/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Everything else → CDO Flask (serves static frontend) ────────────────
    location / {
      proxy_pass       http://dco_backend/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # SPA fallback: if /insurance path, still send to CDO which serves index.html
    }
  }
}
