worker_processes 1;
events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  upstream dco_backend {
    server 127.0.0.1:5002;
  }

  upstream insurance_backend {
    server 127.0.0.1:5003;
  }

  server {
    # Listen on 5000 — matches ECS task port + ALB target group
    listen 5000;

    # ── Insurance WebSocket (/insurance-socket/*) ────────────────────────────
    location /insurance-socket/ {
      proxy_pass         http://insurance_backend/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
    }

    # ── Insurance REST API (/insurance-api/*) ────────────────────────────────
    location /insurance-api/ {
      proxy_pass       http://insurance_backend/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ── CDO WebSocket (/socket.io/*) ─────────────────────────────────────────
    location /socket.io/ {
      proxy_pass         http://dco_backend/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
    }

    # ── CDO REST API (/api/*) ────────────────────────────────────────────────
    location /api/ {
      proxy_pass       http://dco_backend/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Everything else → CDO Flask (serves React SPA + /health) ────────────
    location / {
      proxy_pass       http://dco_backend/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
